<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EBF1F1" />
    </linearGradient>
    <linearGradient id="shoeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA0A0" />
      <stop offset="100%" stop-color="#E85D5D" />
    </linearGradient>
    <linearGradient id="shoeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F4F4F" />
      <stop offset="100%" stop-color="#1A2E2E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" />
      <stop offset="100%" stop-color="#06D6A0" />
    </linearGradient>
  </defs>

  <!-- Outer Ring with Dark Slate Gray border -->
  <circle cx="50" cy="50" r="46" fill="url(#circleGrad)" stroke="#2F4F4F" stroke-width="3.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FFA0A0" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Dynamic Athletic Footwear Silhouette / StepUp Runner Symbol -->
  <!-- Dynamic Speed Swoosh / Sole -->
  <path d="M 24 64 C 34 65, 48 64, 60 59 C 72 54, 78 48, 80 43 C 78 45, 68 51, 54 53 C 40 55, 30 55, 24 64 Z" fill="url(#shoeGrad1)" />
  
  <!-- Upper Shoe Aerodynamic Body -->
  <path d="M 32 58 C 34 50, 40 42, 49 37 C 54 34, 58 35, 62 39 C 64 42, 63 46, 56 48 C 47 50, 38 53, 32 58 Z" fill="url(#shoeGrad2)" />

  <!-- Dynamic Runner Figure / Laces Spark -->
  <circle cx="56" cy="30" r="5" fill="#FFA0A0" />
  <path d="M 52 38 L 57 32" stroke="#FFD166" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Step Dots -->
  <circle cx="70" cy="58" r="3" fill="#06D6A0" />
  <circle cx="78" cy="62" r="2" fill="#FFA0A0" />
  <circle cx="83" cy="65" r="1.5" fill="#2F4F4F" />
</svg>
